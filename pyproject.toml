[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairl"
version = "0.1.0"
description = "Passive Adaptive Impedance Reinforcement Learning: an RL policy with an adaptive lower layer whose constraint satisfaction and passivity hold by structure"
requires-python = ">=3.12"
dependencies = [
    "jax==0.12.0.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "pillow==12.3.0",
    "sympy==1.14.0",
    "mujoco==4.0.1",
]

[project.optional-dependencies]
gpu = ["jax[cuda13]==0.12.0.1"]
viz = ["imageio-ffmpeg==0.8.1"]   # MP4 (H.264) for the rollout videos

[tool.setuptools.packages.find]
where = ["src"]
